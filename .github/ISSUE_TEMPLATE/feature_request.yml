name: Feature request
description: Suggest an improvement for RepTracking
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workout or tracking problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the experience you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other solutions or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, examples, or related links.
